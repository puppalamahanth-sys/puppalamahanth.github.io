<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do List | Mahanth</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <a class="brand" href="index.html">Mahanth</a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="game.html">Game</a>
    <a href="rps.html">RPS</a>
    <a href="calc.html">Calculator</a>
    <a href="todo.html" class="active">To-Do</a>
    <a href="highway.html">Highway</a>
    <a href="signals.html">Signals</a>
  </div>
</nav>

<main>
  <section class="card">
    <h1>📝 To-Do List</h1>
    <p>Your tasks stay saved on this device.</p>

    <form class="todo-form" onsubmit="addTask(event)">
      <input id="task" type="text" placeholder="What do you need to do?" maxlength="100" autocomplete="off">
      <button type="submit">Add</button>
    </form>

    <ul class="todo-list" id="list"></ul>

    <div class="todo-footer" id="footer">
      <span id="count"></span>
      <button class="link-btn" onclick="clearDone()">Clear completed</button>
    </div>
  </section>
</main>

<footer class="footer">© 2026 Mahanth · Built with HTML, CSS &amp; JavaScript</footer>

<script>
let tasks = loadTasks();

function loadTasks() {
  try {
    return JSON.parse(localStorage.getItem("tasks")) || [];
  } catch (e) {
    return [];
  }
}

function save() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
}

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  if (tasks.length === 0) {
    list.innerHTML = '<li class="empty">No tasks yet. Add one above! ✨</li>';
  }

  tasks.forEach(function (task, i) {
    const li = document.createElement("li");
    if (task.done) li.className = "done";

    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = task.done;
    box.setAttribute("aria-label", "Mark as done");
    box.onchange = function () {
      tasks[i].done = box.checked;
      save();
      render();
    };

    const text = document.createElement("span");
    text.className = "text";
    text.textContent = task.text;

    const del = document.createElement("button");
    del.className = "delete";
    del.textContent = "✕";
    del.setAttribute("aria-label", "Delete task");
    del.onclick = function () {
      tasks.splice(i, 1);
      save();
      render();
    };

    li.append(box, text, del);
    list.appendChild(li);
  });

  const left = tasks.filter(function (t) { return !t.done; }).length;
  document.getElementById("count").textContent = left + (left === 1 ? " task left" : " tasks left");
  document.getElementById("footer").style.display = tasks.length ? "flex" : "none";
}

function addTask(e) {
  e.preventDefault();
  const box = document.getElementById("task");
  const text = box.value.trim();
  if (text === "") return;
  tasks.push({ text: text, done: false });
  box.value = "";
  save();
  render();
}

function clearDone() {
  tasks = tasks.filter(function (t) { return !t.done; });
  save();
  render();
}

render();
</script>

</body>
</html>
