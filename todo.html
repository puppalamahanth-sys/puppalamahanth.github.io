<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do List | Mahanth</title>
<link rel="stylesheet" href="style.css">
<style>
ul { list-style: none; padding: 0; margin: 15px 0 0; }
li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #eef1ff;
  padding: 10px 14px;
  margin: 8px 0;
  border-radius: 12px;
  text-align: left;
}
li span { cursor: pointer; flex: 1; }
li.done span { text-decoration: line-through; color: #888; }
li button { padding: 6px 12px; font-size: 14px; background: #c0392b; }
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="game.html">Game</a>
  <a href="rps.html">RPS</a>
  <a href="calc.html">Calculator</a>
  <a href="todo.html">To-Do</a>
</div>

<div class="card">
  <h1>📝 To-Do List</h1>
  <input id="task" type="text" placeholder="Add a task">
  <br>
  <button onclick="addTask()">Add</button>
  <ul id="list"></ul>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

function save() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
}
function show() {
  let list = document.getElementById("list");
  list.innerHTML = "";
  for (let i = 0; i < tasks.length; i++) {
    let li = document.createElement("li");
    if (tasks[i].done) { li.className = "done"; }
    let s = document.createElement("span");
    s.innerText = tasks[i].text;
    s.onclick = function () { tasks[i].done = !tasks[i].done; save(); show(); };
    let b = document.createElement("button");
    b.innerText = "X";
    b.onclick = function () { tasks.splice(i, 1); save(); show(); };
    li.appendChild(s);
    li.appendChild(b);
    list.appendChild(li);
  }
}
function addTask() {
  let box = document.getElementById("task");
  if (box.value.trim() === "") { return; }
  tasks.push({ text: box.value.trim(), done: false });
  box.value = "";
  save();
  show();
}
show();
</script>

<div class="footer">© 2026 Mahanth</div>

</body>
</html>
