<div class="card">
  <h1>🧮 Calculator</h1>
  <input id="a" type="number" placeholder="First number">
  <input id="b" type="number" placeholder="Second number">
  <br>
  <button onclick="calc('+')">+</button>
  <button onclick="calc('-')">-</button>
  <button onclick="calc('*')">x</button>
  <button onclick="calc('/')">/</button>
  <p class="result" id="answer">Answer: </p>
</div>

<script>
function calc(op) {
  let a = Number(document.getElementById("a").value);
  let b = Number(document.getElementById("b").value);
  let r;
  if (op === "+") { r = a + b; }
  else if (op === "-") { r = a - b; }
  else if (op === "*") { r = a * b; }
  else { r = b === 0 ? "Cannot divide by zero" : a / b; }
  document.getElementById("answer").innerText = "Answer: " + r;
}
</script>
