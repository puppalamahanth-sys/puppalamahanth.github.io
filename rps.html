<body style="background-color: lavender; text-align: center;">
<h1>Rock Paper Scissors</h1>
<button onclick="play('rock')">Rock</button>
<button onclick="play('paper')">Paper</button>
<button onclick="play('scissors')">Scissors</button>
<p id="result"></p>
<p id="score">You: 0 | Computer: 0</p>
<a href="index.html">Back to home</a>
<script>
let you = 0;
let comp = 0;
function play(choice) {
  let options = ["rock", "paper", "scissors"];
  let pick = options[Math.floor(Math.random() * 3)];
  let text = "You: " + choice + ", Computer: " + pick + ". ";
  if (choice === pick) { text += "Draw."; }
  else if ((choice === "rock" && pick === "scissors") || (choice === "paper" && pick === "rock") || (choice === "scissors" && pick === "paper")) { you++; text += "You win!"; }
  else { comp++; text += "Computer wins."; }
  document.getElementById("result").innerText = text;
  document.getElementById("score").innerText = "You: " + you + " | Computer: " + comp;
}
</script>
</body>
